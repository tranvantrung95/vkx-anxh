<g transform="translate(640,326)"><rect width="560" height="96" rx="6" fill="#0f172a"/><rect width="560" height="96" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="10" y="17" fill="#22d3ee" font-size="10" font-weight="700">E06</text><text x="42" y="17" fill="white" font-size="11" font-weight="700">QUAN HỆ NGƯỜI–NGƯỜI</text><line x1="0" y1="26" x2="560" y2="26" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.5"/><text x="10" y="43" fill="#94a3b8" font-size="8.5">Ngoại lệ: ủy quyền thờ cúng, người chăm sóc. Đánh dấu nguồn 'nhập tay'.</text><rect x="10" y="56" width="46.3" height="14" rx="3" fill="rgba(34,211,238,0.16)" stroke="#22d3ee" stroke-width="0.8"/><text x="33.2" y="66" fill="#67e8f9" font-size="8" font-weight="600" text-anchor="middle">ETL/API</text><rect x="61.300000000000004" y="56" width="56.1" height="14" rx="3" fill="rgba(251,191,36,0.16)" stroke="#fbbf24" stroke-width="0.8"/><text x="89.4" y="66" fill="#fcd34d" font-size="8" font-weight="600" text-anchor="middle">VT05 nhập</text><rect x="122.4" y="56" width="61.0" height="14" rx="3" fill="rgba(52,211,153,0.16)" stroke="#34d399" stroke-width="0.8"/><text x="152.9" y="66" fill="#6ee7b7" font-size="8" font-weight="600" text-anchor="middle">VT04 duyệt</text><text x="550" y="88" fill="#cbd5e1" font-size="7.5" font-style="italic" text-anchor="end">ETL nạp lại không ghi đè</text></g>
<g transform="translate(640,444)"><rect width="560" height="96" rx="6" fill="#0f172a"/><rect width="560" height="96" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="10" y="17" fill="#a78bfa" font-size="10" font-weight="700">E15</text><text x="42" y="17" fill="white" font-size="11" font-weight="700">SỰ KIỆN</text><line x1="0" y1="26" x2="560" y2="26" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.5"/><text x="10" y="43" fill="#94a3b8" font-size="8.5">Chỉ đổi trạng thái sự kiện do engine tạo, không sửa nội dung.</text><rect x="10" y="56" width="61.0" height="14" rx="3" fill="rgba(167,139,250,0.18)" stroke="#a78bfa" stroke-width="0.8"/><text x="40.5" y="66" fill="#c4b5fd" font-size="8" font-weight="600" text-anchor="middle">Engine tạo</text><rect x="76.0" y="56" width="75.7" height="14" rx="3" fill="rgba(251,191,36,0.16)" stroke="#fbbf24" stroke-width="0.8"/><text x="113.8" y="66" fill="#fcd34d" font-size="8" font-weight="600" text-anchor="middle">VT05 xác nhận</text><text x="550" y="88" fill="#cbd5e1" font-size="7.5" font-style="italic" text-anchor="end">Không cần duyệt</text></g>
<g transform="translate(640,562)"><rect width="560" height="96" rx="6" fill="#0f172a"/><rect width="560" height="96" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="10" y="17" fill="#a78bfa" font-size="10" font-weight="700">E16</text><text x="42" y="17" fill="white" font-size="11" font-weight="700">CẢNH BÁO</text><line x1="0" y1="26" x2="560" y2="26" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.5"/><text x="10" y="43" fill="#94a3b8" font-size="8.5">Đổi trạng thái, ghi kết quả xử lý. UC06 đến UC08 do VT06 xử lý.</text><rect x="10" y="56" width="90.4" height="14" rx="3" fill="rgba(167,139,250,0.18)" stroke="#a78bfa" stroke-width="0.8"/><text x="55.2" y="66" fill="#c4b5fd" font-size="8" font-weight="600" text-anchor="middle">Engine phát hiện</text><rect x="105.4" y="56" width="61.0" height="14" rx="3" fill="rgba(251,191,36,0.16)" stroke="#fbbf24" stroke-width="0.8"/><text x="135.9" y="66" fill="#fcd34d" font-size="8" font-weight="600" text-anchor="middle">VT05 xử lý</text><rect x="171.4" y="56" width="61.0" height="14" rx="3" fill="rgba(52,211,153,0.16)" stroke="#34d399" stroke-width="0.8"/><text x="201.9" y="66" fill="#6ee7b7" font-size="8" font-weight="600" text-anchor="middle">VT04 duyệt</text><text x="550" y="88" fill="#cbd5e1" font-size="7.5" font-style="italic" text-anchor="end">Chạy lại không ghi đè phần xử lý</text></g>
