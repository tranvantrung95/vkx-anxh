<text x="40" y="58" fill="#94a3b8" font-size="9">VT05 thêm hoặc sửa dữ liệu của thực thể nào, ai duyệt, chỉ được xem gì. Nguồn: output/project019_007 mục 3.6 (khối F). Giả định chờ Q56 đến Q58.</text>
